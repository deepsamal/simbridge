[project]
name = "simbridge"
version = "0.1.0"
description = "MCP server exposing a headless Renode simulator to coding agents"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2"]

[project.scripts]
simbridge = "simbridge.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
