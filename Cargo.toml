[package]
name = "simbridge"
version = "0.1.0"
edition = "2021"
description = "Firmware-in-the-loop development for coding agents: runs real firmware on a Renode-simulated MCU over MCP"
license = "MIT"
repository = "https://github.com/deepsamal/simbridge"

[dependencies]
anyhow = "1.0.104"
regex = "1.13.1"
rmcp = { version = "3.9.0", features = ["server", "transport-io", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
svd-parser = { version = "0.14.10", features = ["expand"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "sync"] }

[workspace]
exclude = ["firmware", "bench"]

[dev-dependencies]
rmcp = { version = "3.9.0", features = ["client", "transport-child-process"] }
tokio = { version = "1.54.1", features = ["process"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
