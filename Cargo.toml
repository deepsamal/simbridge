[package]
name = "simbridge"
version = "0.1.0"
edition = "2021"
description = "MCP server exposing a headless Renode simulator to coding agents"

[dependencies]
anyhow = "1.0.104"
regex = "1.13.1"
rmcp = { version = "3.9.0", features = ["server", "transport-io", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "sync"] }

[workspace]
exclude = ["firmware"]

[dev-dependencies]
rmcp = { version = "3.9.0", features = ["client", "transport-child-process"] }
tokio = { version = "1.54.1", features = ["process"] }
