[package]
name = "t1-firmware"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "1"
# Peripheral access crate: register definitions and the interrupt vector table. No HAL.
stm32f4 = { version = "0.16", features = ["stm32f407", "rt"] }

[profile.release]
debug = true
opt-level = "s"
